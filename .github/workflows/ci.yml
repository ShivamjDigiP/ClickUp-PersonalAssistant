name: CI

# Runs on every push to main and on every pull request. If any step fails, the change should not be deployed.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run (saves time and minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says (and fails if it disagrees with package.json).
      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # Reuse Next.js's build cache between runs to make the build faster.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # A production build catches problems that only show up when deployed (this has already happened once here).
      # No secrets are needed: the build never talks to ClickUp or the AI.
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # Reports known security problems in dependencies. It never blocks a change (many alerts are not exploitable here),
  # but the summary shows up in the run so it doesn't go unnoticed.
  audit:
    name: Dependency security report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --omit=dev --audit-level=high
